name: Multi-Platform Release

on:
  workflow_dispatch:
    inputs:
        version:
          description: 'Version type ("patch"|"minor"|"major")'     
          required: true
          default: 'patch'
permissions:
  contents: write
jobs:
  version-increment:
      runs-on: ubuntu-latest
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      steps:  
      - name: Setup env
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          repository: NewRecruit-eu/nr-editor
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.17.0

      - name: Run version increment script and capture output
        id: version_script
        run: echo "version=$(node ./increment-version.js --${{ github.event.inputs.version }})" >> "$GITHUB_OUTPUT"

      - name: Commit and push if version updated
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"
          git add ./package.json ./package-lock.json
          git commit -m "${{ steps.version_script.outputs.version }}"
          git push

  build-executables:
    runs-on: ${{ matrix.os }}
    needs: version-increment
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            platform_flag: win
          - os: macos-latest
            platform_flag: mac
          - os: ubuntu-latest
            platform_flag: linux
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Setup environment
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          repository: NewRecruit-eu/nr-editor
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: master
          fetch-depth: 1

      # nr-shared is private: cloned with its read-only deploy key, the workflow's token only reaches this repo
      - name: Checkout nr-shared
        shell: bash
        env:
          NR_SHARED_DEPLOY_KEY: ${{ secrets.NR_SHARED_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$NR_SHARED_DEPLOY_KEY" > ~/.ssh/nr_shared
          chmod 600 ~/.ssh/nr_shared
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global url."git@github.com:NewRecruit-eu/nr-shared".insteadOf https://github.com/NewRecruit-eu/nr-shared
          GIT_SSH_COMMAND="ssh -i ~/.ssh/nr_shared -o IdentitiesOnly=yes" git submodule update --init

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.17.0

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Create release
        run: npx electron-builder --${{ matrix.platform_flag }} --publish=always

  build-ghpages:
    runs-on: ubuntu-latest
    needs: version-increment
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Setup environment
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          repository: NewRecruit-eu/nr-editor
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: master
          fetch-depth: 1

      # nr-shared is private: cloned with its read-only deploy key, the workflow's token only reaches this repo
      - name: Checkout nr-shared
        shell: bash
        env:
          NR_SHARED_DEPLOY_KEY: ${{ secrets.NR_SHARED_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$NR_SHARED_DEPLOY_KEY" > ~/.ssh/nr_shared
          chmod 600 ~/.ssh/nr_shared
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global url."git@github.com:NewRecruit-eu/nr-shared".insteadOf https://github.com/NewRecruit-eu/nr-shared
          GIT_SSH_COMMAND="ssh -i ~/.ssh/nr_shared -o IdentitiesOnly=yes" git submodule update --init

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.17.0

      - name: Install dependencies
        run: npm ci

      - name: Build application for GitHub Pages
        run: npm run generate -- --ghpages

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
